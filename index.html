            border-radius: 8px;

            font-size: 20px;

            font-family: 'Georgia', serif;
            letter-spacing: 0.5px;

        /* Call To Action Button */
        .btn-join {

            padding: 14px 10px;
            background: linear-gradient(180deg, #1b75bc 0%, #004080 100%);
            border: 1.5px solid #fff;
            border-radius: 4px;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.4);
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        /* Click Here Pointer */
        .click-here {
            font-size: 26px;
            font-weight: 800;
            color: #38b6ff;
            margin: 2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Features Main Card */
        .features-card {
            width: 100%;
            background-color: #080808;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .feature-item {
            font-size: 16px;
            font-weight: 600;
        }

        .stars {
            color: #ff9900;
            font-size: 16px;
        }

        /* Footer Tag Box */
        .footer-box {
            width: 100%;
            border: 1.5px solid #fff;
            border-radius: 6px;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;

        /* Managed By Section */

            border-radius: 12px;
